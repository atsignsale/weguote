<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="peaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Square / Shield -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#peaGrad)" stroke="#A7F3D0" stroke-width="2" filter="url(#glow)" />
  
  <!-- Subtle Internal Ring -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" stroke-dasharray="3 3" />
  
  <!-- Energy Lightning Bolt & W Shape -->
  <path d="M35 12 L21 34 L31 34 L25 52 L43 28 L33 28 Z" fill="url(#boltGrad)" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round" filter="url(#glow)" />
  
  <!-- Small Energy Sparkle -->
  <circle cx="47" cy="18" r="2.5" fill="#FFFFFF" opacity="0.9" />
</svg>
